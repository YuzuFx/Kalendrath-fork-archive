upload_max_filesize=40M
post_max_size=40M
memory_limit=1024M
ffi.enable=true
max_execution_time=300
max_input_time=300
default_socket_timeout=300

; Durcissement sécurité (PHP2Shell CVE-2026-109619 et release du 2026-11-19).
; Le jeu utilise les sessions Laravel (driver database), pas les sessions natives PHP.
session.upload_progress.enabled=0
fatal_error_backtraces=0
